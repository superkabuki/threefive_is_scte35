
[project]
name = "threefive"
version = "3.1.9"
authors = [
  { name="AdrianofDoom", email="spam@iodisco.com" },
]
description = "threefive - SCTE-35 for the people."
readme = "README.md"
requires-python = ">=3.9"
dependencies=["srtfu >=0.0.3","pyaes",]

classifiers = [
        "Environment :: Console",
        "Operating System :: OS Independent",
        "Topic :: Multimedia :: Video",
        "Programming Language :: Python :: 3.9",
        "Programming Language :: Python :: Implementation :: PyPy",
        "Programming Language :: Python :: Implementation :: CPython",
]

license = "Sleepycat"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/superkabuki/threefive"
Issues = "https://github.com/superkabuki/threefive/issues"

[project.scripts]
scte35fix = "threefive.sixfix:cli"
scte35inject = "threefive.superkabuki:cli"
threefive = "threefive.cli:threefivecli"
